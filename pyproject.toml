[project]
name = "asr-bus"
version = "1.0.0"
description = "Telegram bot for Avenue South Residence shuttle bus schedules"
requires-python = ">=3.11"
dependencies = [
    "python-telegram-bot==13.0.0",
    "python-dotenv==1.2.2",
    "holidays==0.95",
    "setuptools<81",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

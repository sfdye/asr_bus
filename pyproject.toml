[project]
name = "asr-bus"
version = "1.0.0"
description = "Telegram bot for Avenue South Residence shuttle bus schedules"
requires-python = ">=3.13"
dependencies = [
    "python-telegram-bot==22.7",
    "python-dotenv==1.2.2",
    "holidays==0.95",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

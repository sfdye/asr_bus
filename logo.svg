    <rect x="147" y="330" width="6" height="6" rx="1" fill="#fbbf24" opacity="0.55"/>
    <rect x="132" y="341" width="6" height="6" rx="1" fill="#fbbf24" opacity="0.5"/>
    <rect x="142" y="341" width="6" height="6" rx="1" fill="#fbbf24" opacity="0.4"/>

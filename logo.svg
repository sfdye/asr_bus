  <rect x="178" y="95" width="62" height="8" rx="2" fill="#c0c0c0" opacity="0.85"/>

  <!-- 5 conserved SIT heritage flat blocks (Silat Avenue), centred between towers -->
  <!-- Block 1 (back) -->
  <g>
    <rect x="127" y="312" width="32" height="48" rx="1" fill="#c8956b" opacity="0.9"/>
    <rect x="127" y="309" width="32" height="4" rx="1" fill="#b07850"/>
    <rect x="132" y="319" width="6" height="6" rx="1" fill="#fbbf24" opacity="0.6"/>

    <rect x="178" y="311" width="30" height="4" rx="1" fill="#b8906a"/>
    <rect x="183" y="320" width="6" height="6" rx="1" fill="#fbbf24" opacity="0.5"/>
    <rect x="193" y="320" width="6" height="6" rx="1" fill="#fbbf24" opacity="0.55"/>
    <rect x="183" y="331" width="6" height="6" rx="1" fill="#fbbf24" opacity="0.45"/>
    <rect x="198" y="331" width="6" height="6" rx="1" fill="#fbbf24" opacity="0.5"/>
    <rect x="188" y="342" width="6" height="6" rx="1" fill="#fbbf24" opacity="0.4"/>
    <rect x="178" y="354" width="30" height="2" fill="#a07050" opacity="0.6"/>
  </g>

  <!-- Block 5 -->
  <g>
    <rect x="194" y="318" width="28" height="42" rx="1" fill="#c89878" opacity="0.8"/>
    <rect x="194" y="315" width="28" height="4" rx="1" fill="#a87858"/>
    <rect x="199" y="324" width="6" height="6" rx="1" fill="#fbbf24" opacity="0.5"/>
    <rect x="209" y="324" width="6" height="6" rx="1" fill="#fbbf24" opacity="0.45"/>
    <rect x="199" y="335" width="6" height="6" rx="1" fill="#fbbf24" opacity="0.4"/>
    <rect x="209" y="335" width="6" height="6" rx="1" fill="#fbbf24" opacity="0.5"/>

    <rect x="200" y="115" width="8" height="6" rx="1"/>
    <rect x="212" y="115" width="8" height="6" rx="1"/>
    <rect x="224" y="115" width="8" height="6" rx="1"/>
    <rect x="188" y="130" width="8" height="6" rx="1"/>
    <rect x="212" y="130" width="8" height="6" rx="1"/>
    <rect x="200" y="145" width="8" height="6" rx="1"/>
    <rect x="224" y="145" width="8" height="6" rx="1"/>
    <rect x="188" y="160" width="8" height="6" rx="1"/>

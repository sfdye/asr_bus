    <rect x="200" y="220" width="8" height="6" rx="1"/>
    <rect x="188" y="220" width="8" height="6" rx="1"/>
    <rect x="224" y="235" width="8" height="6" rx="1"/>
    <rect x="212" y="235" width="8" height="6" rx="1"/>
    <rect x="188" y="250" width="8" height="6" rx="1"/>
    <rect x="200" y="250" width="8" height="6" rx="1"/>
    <rect x="212" y="265" width="8" height="6" rx="1"/>
    <rect x="224" y="265" width="8" height="6" rx="1"/>
    <rect x="188" y="280" width="8" height="6" rx="1"/>
    <rect x="200" y="295" width="8" height="6" rx="1"/>
    <rect x="224" y="295" width="8" height="6" rx="1"/>
    <rect x="188" y="310" width="8" height="6" rx="1"/>
    <rect x="212" y="310" width="8" height="6" rx="1"/>
    <rect x="200" y="325" width="8" height="6" rx="1"/>

    <rect x="109" y="50" width="2" height="10" rx="1" fill="#4ade80"/>

    <!-- Headlights -->
    <circle cx="155" cy="50" r="5" fill="#fbbf24"/>
    <circle cx="155" cy="50" r="3" fill="#fef08a"/>

    <!-- Tail lights -->
    <rect x="0" y="46" width="4" height="8" rx="2" fill="#ef4444"/>

    <!-- Wheels -->
    <circle cx="35" cy="72" r="12" fill="#1e293b"/>
    <circle cx="35" cy="72" r="7" fill="#475569"/>
    <circle cx="35" cy="72" r="3" fill="#1e293b"/>
    <circle cx="130" cy="72" r="12" fill="#1e293b"/>
    <circle cx="130" cy="72" r="7" fill="#475569"/>
    <circle cx="130" cy="72" r="3" fill="#1e293b"/>

    <!-- "ASR" text on bus side -->
    <text x="50" y="62" font-family="'Avenir Next', 'Avenir', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="white" text-anchor="middle" letter-spacing="3">ASR</text>
  </g>

  <!-- Bot name text at bottom -->
  <text x="256" y="460" font-family="'Avenir Next', 'Avenir', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="700" fill="white" text-anchor="middle" letter-spacing="5" filter="url(#textShadow)">ASR BUS BOT</text>

  <!-- Subtle glow around bus -->
  <ellipse cx="340" cy="365" rx="100" ry="20" fill="#4ade80" opacity="0.08"/>
</svg>

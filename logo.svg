  <!-- Left tower crown -->
  <rect x="108" y="95" width="62" height="8" rx="2" fill="#c0c0c0" opacity="0.9"/>

  <!-- Right tower (same height as left) -->
  <rect x="180" y="100" width="58" height="260" rx="3" fill="url(#towerGrad)" opacity="0.80"/>

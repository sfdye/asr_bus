  <!-- Road lane markings -->
  <g fill="#fbbf24" opacity="0.5">
    <rect x="100" y="383" width="30" height="3" rx="1"/>
    <rect x="160" y="383" width="30" height="3" rx="1"/>
    <rect x="220" y="383" width="30" height="3" rx="1"/>
    <rect x="340" y="383" width="30" height="3" rx="1"/>
    <rect x="400" y="383" width="30" height="3" rx="1"/>
  </g>

  <!-- Shuttle Bus (main element, right of center) -->
  <g transform="translate(260, 320)">
    <!-- Bus shadow -->
    <ellipse cx="80" cy="78" rx="85" ry="8" fill="black" opacity="0.2"/>

    <!-- Bus body -->
    <rect x="0" y="5" width="160" height="65" rx="12" fill="url(#busBody)"/>

    <!-- Bus roof accent -->
    <rect x="5" y="5" width="150" height="8" rx="5" fill="#16a34a"/>

    <!-- Windshield -->
    <rect x="120" y="18" width="32" height="30" rx="6" fill="#e0f2fe" opacity="0.9"/>
    <rect x="122" y="20" width="28" height="26" rx="5" fill="#bae6fd" opacity="0.5"/>

    <!-- Side windows -->
    <rect x="14" y="18" width="24" height="22" rx="4" fill="#e0f2fe" opacity="0.85"/>
    <rect x="44" y="18" width="24" height="22" rx="4" fill="#e0f2fe" opacity="0.85"/>
    <rect x="74" y="18" width="24" height="22" rx="4" fill="#e0f2fe" opacity="0.85"/>
    <rect x="104" y="18" width="12" height="22" rx="4" fill="#e0f2fe" opacity="0.85"/>

    <!-- Window reflections -->

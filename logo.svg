    <rect x="160" y="308" width="34" height="52" rx="1" fill="#c09070" opacity="0.9"/>
    <rect x="160" y="305" width="34" height="4" rx="1" fill="#a07050"/>
    <rect x="165" y="314" width="6" height="6" rx="1" fill="#fbbf24" opacity="0.6"/>
    <rect x="176" y="314" width="6" height="6" rx="1" fill="#fbbf24" opacity="0.5"/>
    <rect x="165" y="325" width="6" height="6" rx="1" fill="#fbbf24" opacity="0.5"/>
    <rect x="181" y="325" width="6" height="6" rx="1" fill="#fbbf24" opacity="0.55"/>
    <rect x="170" y="336" width="6" height="6" rx="1" fill="#fbbf24" opacity="0.45"/>
    <rect x="181" y="336" width="6" height="6" rx="1" fill="#fbbf24" opacity="0.4"/>
    <rect x="165" y="347" width="6" height="6" rx="1" fill="#fbbf24" opacity="0.5"/>
    <rect x="160" y="354" width="34" height="2" fill="#a07050" opacity="0.6"/>

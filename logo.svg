    <rect x="154" y="190" width="8" height="6" rx="1"/>
    <rect x="118" y="205" width="8" height="6" rx="1"/>
    <rect x="142" y="205" width="8" height="6" rx="1"/>
    <rect x="130" y="220" width="8" height="6" rx="1"/>
    <rect x="154" y="220" width="8" height="6" rx="1"/>
    <rect x="118" y="235" width="8" height="6" rx="1"/>
    <rect x="142" y="235" width="8" height="6" rx="1"/>
    <rect x="130" y="250" width="8" height="6" rx="1"/>
    <rect x="154" y="250" width="8" height="6" rx="1"/>
    <rect x="118" y="265" width="8" height="6" rx="1"/>
    <rect x="142" y="265" width="8" height="6" rx="1"/>
    <rect x="130" y="280" width="8" height="6" rx="1"/>
    <rect x="118" y="295" width="8" height="6" rx="1"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="60%" stop-color="#16213e"/>
      <stop offset="100%" stop-color="#0f3460"/>
    </linearGradient>
    <linearGradient id="towerGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8e8e8"/>
      <stop offset="100%" stop-color="#b0b0b0"/>
    </linearGradient>
    <linearGradient id="busBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a1a2e" stop-opacity="0"/>
      <stop offset="30%" stop-color="#334155"/>
      <stop offset="70%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1a1a2e" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shophouse" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4a574"/>
      <stop offset="100%" stop-color="#b8956a"/>
    </linearGradient>
    <filter id="textShadow" x="-10%" y="-10%" width="120%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
      <feOffset in="blur" dx="0" dy="2" result="offsetBlur"/>
      <feFlood flood-color="#000000" flood-opacity="0.4" result="color"/>
      <feComposite in="color" in2="offsetBlur" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="256" fill="url(#sky)"/>

  <!-- Stars -->
  <circle cx="80" cy="80" r="2" fill="white" opacity="0.6"/>
  <circle cx="140" cy="50" r="1.5" fill="white" opacity="0.4"/>
  <circle cx="350" cy="70" r="2" fill="white" opacity="0.5"/>
  <circle cx="420" cy="100" r="1.5" fill="white" opacity="0.3"/>
  <circle cx="300" cy="40" r="1" fill="white" opacity="0.5"/>
  <circle cx="200" cy="95" r="1.5" fill="white" opacity="0.4"/>
  <circle cx="450" cy="60" r="1" fill="white" opacity="0.6"/>

  <!-- ASR Twin Towers (equal height) -->
  <!-- Left tower -->
  <rect x="110" y="100" width="58" height="260" rx="3" fill="url(#towerGrad)" opacity="0.85"/>
  <!-- Left tower windows -->
  <g fill="#fbbf24" opacity="0.7">
    <rect x="118" y="115" width="8" height="6" rx="1"/>
    <rect x="130" y="115" width="8" height="6" rx="1"/>
    <rect x="142" y="115" width="8" height="6" rx="1"/>
    <rect x="154" y="115" width="8" height="6" rx="1"/>
